name: CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          test -f index.html
          test -f README.md
          echo "Required files found"

      - name: Validate HTML
        run: npx --yes htmlhint index.html

      - name: Build summary
        run: echo "Build and tests passed for commit ${{ github.sha }}"
