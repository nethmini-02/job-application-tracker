<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Application Tracker</title>
</head>
<body>
  <h1>Job Application Tracker</h1>
  <p>Version 0.4 - Sprint 1 build</p>

  <input id="company" placeholder="Company">
  <input id="role" placeholder="Role">
  <select id="status">
    <option>Applied</option>
    <option>Interview</option>
    <option>Offer</option>
    <option>Rejected</option>
  </select>
  <button id="add">Add application</button>

  <ul id="list"></ul>

  <script>
    var KEY = 'jat-applications';
    var applications = [];

    function load() {
      try {
        applications = JSON.parse(localStorage.getItem(KEY)) || [];
      } catch (e) {
        applications = [];
      }
    }

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(applications));
      } catch (e) {}
    }

    function render() {
      var list = document.getElementById('list');
      list.innerHTML = '';
      applications.forEach(function (app) {
        var li = document.createElement('li');
        li.textContent = app.company + ' - ' + app.role + ' (' + app.status + ')';
        list.appendChild(li);
      });
    }

    document.getElementById('add').addEventListener('click', function () {
      var company = document.getElementById('company').value;
      var role = document.getElementById('role').value;
      var status = document.getElementById('status').value;
      if (!company || !role) { return; }
      applications.push({ company: company, role: role, status: status });
      save();
      render();
      document.getElementById('company').value = '';
      document.getElementById('role').value = '';
    });

    load();
    render();
  </script>
</body>
</html>
